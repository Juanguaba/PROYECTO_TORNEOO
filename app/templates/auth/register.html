{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}

<h1>Registro</h1>

<form method="POST">

    <input type="text"
           name="nombre"
           placeholder="Nombre completo"
           required>

    <br><br>

    <input type="text"
           name="username"
           placeholder="Nombre de usuario"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Correo"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Contraseña"
           required>

    <br><br>

    <input type="password"
           name="confirmar"
           placeholder="Confirmar contraseña"
           required>

    <br><br>

    <button type="submit">

        Registrarse

    </button>

</form>

{% endblock %}

<div class="page-header d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="mb-1">
      <i class="bi bi-person-vcard-fill text-success"></i>

      {{ jugador.nombre }} {{ jugador.apellido }}
    </h2>

    <p class="text-muted mb-0">Perfil completo del jugador</p>
  </div>

  <div class="d-flex gap-2">
    <a
      href="{{ url_for('jugadores.index', equipo_id=equipo.id) }}"
      class="btn btn-outline-secondary"
    >
      <i class="bi bi-arrow-left"></i>
      Volver
    </a>

    {% if modo == "detalle" %}
    <a
      href="{{ url_for('jugadores.editar', jugador_id=jugador.id) }}"
      class="btn btn-warning"
    >
      <i class="bi bi-pencil"></i>
      Editar
    </a>
    {% endif %}

    <form
      id="formEliminarJugador"
      action="{{ url_for('jugadores.eliminar', jugador_id=jugador.id) }}"
      method="POST"
      class="d-inline"
    >
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i>
        Eliminar
      </button>
    </form>
  </div>
</div>

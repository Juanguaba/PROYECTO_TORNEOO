<div class="card shadow-sm border-0">
  <div class="card-body text-center">
    <img
      src="{{ url_for(
        'static',
        filename='uploads/jugadores/' + jugador.foto
        if jugador.foto
        else 'img/default_player.png'
    ) }}"
      class="player-profile-photo mb-3"
      alt="Jugador"
    />

    <h3 class="mb-1">{{ jugador.nombre }}</h3>

    <p class="text-muted">{{ jugador.apellido }}</p>

    <span class="badge bg-primary px-3 py-2"> {{ jugador.posicion }} </span>

    <div class="mt-3">
      <div class="player-number-large">#{{ jugador.numero }}</div>
    </div>

    <div class="mt-4">
      <span class="badge bg-success px-3 py-2"> {{ jugador.estado }} </span>
    </div>
  </div>
</div>

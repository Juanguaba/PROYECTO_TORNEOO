{% from "components/forms/form_section.html" import form_section %} {% call
form_section( "Información Adicional", "bi-chat-left-text-fill" ) %}

<div class="row">
  <div class="col-md-6">
    <div class="form-check form-switch mb-4">
      <input
        class="form-check-input"
        type="checkbox"
        id="capitan"
        name="capitan"
      />

      <label class="form-check-label" for="capitan">
        ⭐ Capitán del equipo
      </label>
    </div>
  </div>

  <div class="col-md-6">
    <div class="form-check form-switch mb-4">
      <input
        class="form-check-input"
        type="checkbox"
        id="lesionado"
        name="lesionado"
      />

      <label class="form-check-label" for="lesionado">
        🩺 Jugador lesionado
      </label>
    </div>
  </div>
</div>

<div class="mb-3">
  <label class="form-label">
    <i class="bi bi-chat-left-text"></i>

    Observaciones
  </label>

  <textarea
    class="form-control"
    name="observaciones"
    rows="5"
    placeholder="Escribe aquí información adicional sobre el jugador..."
  ></textarea>
</div>

{% endcall %}

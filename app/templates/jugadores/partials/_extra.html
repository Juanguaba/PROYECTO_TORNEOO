{% from "components/forms/form_section.html" import form_section %} {% call
form_section( "Información Adicional", "bi-chat-left-text-fill" ) %}

<div class="row">
  <div class="col-md-6">
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="capitan" />

      <label class="form-check-label"> Capitán del equipo </label>
    </div>
  </div>

  <div class="col-md-6">
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="lesionado" />

      <label class="form-check-label"> Jugador lesionado </label>
    </div>
  </div>
</div>

<label class="form-label"> Observaciones </label>

<textarea
  name="observaciones"
  rows="4"
  class="form-control"
  placeholder="Información adicional sobre el jugador..."
></textarea>

{% endcall %}

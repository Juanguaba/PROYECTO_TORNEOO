{% from "components/forms/form_section.html" import form_section %} {% call
form_section( "Información Personal", "bi-person-fill" ) %}

<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">
      <i class="bi bi-person"></i>

      Nombre <span class="text-danger">*</span>
    </label>

    <input
      type="text"
      name="nombre"
      class="form-control"
      placeholder="Ej: Juan"
      value="{{ jugador.nombre if jugador is defined else '' }}"
      required
    />
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label">
      <i class="bi bi-person-vcard"></i>

      Apellidos <span class="text-danger">*</span>
    </label>

    <input
      type="text"
      name="apellido"
      class="form-control"
      placeholder="Ej: Pérez Gómez"
      value="{{ jugador.apellido if jugador is defined else '' }}"
      required
    />
  </div>
</div>

<div class="row">
  <div class="col-md-4 mb-3">
    <label class="form-label">
      <i class="bi bi-calendar-event"></i>

      Fecha de nacimiento
    </label>

    <input
      id="fechaNacimiento"
      type="date"
      name="fecha_nacimiento"
      class="form-control"
      value="{{ jugador.fecha_nacimiento.strftime('%Y-%m-%d') if jugador is defined else '' }}"
      required
    />
  </div>

  <div class="col-md-2 mb-3">
    <label class="form-label">
      <i class="bi bi-hourglass-split"></i>

      Edad
    </label>

    <input
      id="edadJugador"
      type="text"
      class="form-control"
      placeholder="--"
      value="{{ calcular_edad(jugador.fecha_nacimiento) if jugador is defined else '' }}"
      readonly
    />
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label">
      <i class="bi bi-globe-americas"></i>

      Nacionalidad
    </label>

<select name="nacionalidad" class="form-select" required>
    <option value="">Seleccione...</option>

    <option value="Colombia"
        {% if jugador is defined and jugador.nacionalidad == "Colombia" %}selected{% endif %}>
        Colombia
    </option>

    <option value="Brasil"
        {% if jugador is defined and jugador.nacionalidad == "Brasil" %}selected{% endif %}>
        Brasil
    </option>

    <option value="Argentina"
        {% if jugador is defined and jugador.nacionalidad == "Argentina" %}selected{% endif %}>
        Argentina
    </option>

    <option value="Uruguay"
        {% if jugador is defined and jugador.nacionalidad == "Uruguay" %}selected{% endif %}>
        Uruguay
    </option>

    <option value="España"
        {% if jugador is defined and jugador.nacionalidad == "España" %}selected{% endif %}>
        España
    </option>

    <option value="Portugal"
        {% if jugador is defined and jugador.nacionalidad == "Portugal" %}selected{% endif %}>
        Portugal
    </option>

    <option value="Francia"
        {% if jugador is defined and jugador.nacionalidad == "Francia" %}selected{% endif %}>
        Francia
    </option>

    <option value="México"
        {% if jugador is defined and jugador.nacionalidad == "México" %}selected{% endif %}>
        México
    </option>

    <option value="Chile"
        {% if jugador is defined and jugador.nacionalidad == "Chile" %}selected{% endif %}>
        Chile
    </option>

    <option value="Ecuador"
        {% if jugador is defined and jugador.nacionalidad == "Ecuador" %}selected{% endif %}>
        Ecuador
    </option>

</select>
  </div>
</div>

{% endcall %}

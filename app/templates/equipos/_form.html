<div class="card shadow-sm">
  <div class="card-body p-4">
    <form method="POST" enctype="multipart/form-data">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"> Nombre del Equipo </label>

          <input
            type="text"
            class="form-control"
            name="nombre"
            value="{{ equipo.nombre if equipo else '' }}"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label"> Ciudad </label>

          <input
            type="text"
            class="form-control"
            name="ciudad"
            value="{{ equipo.ciudad if equipo else '' }}"
            required
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"> Entrenador </label>

          <input
            type="text"
            class="form-control"
            name="entrenador"
            value="{{ equipo.entrenador if equipo else '' }}"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label"> Año de Fundación </label>

          <input
            type="number"
            class="form-control"
            name="fundacion"
            min="1800"
            max="2100"
            value="{{ equipo.fundacion if equipo else '' }}"
            required
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4">
          <label class="form-label"> Estado </label>

          <select class="form-select" name="estado">
            <option
              value="1"
              {%
              if
              not
              equipo
              or
              equipo.estado
              %}
              selected
              {%
              endif
              %}
            >
              Activo
            </option>

            <option
              value="0"
              {%
              if
              equipo
              and
              not
              equipo.estado
              %}
              selected
              {%
              endif
              %}
            >
              Inactivo
            </option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        {% if equipo %}

        <label class="form-label fw-bold"> Escudo actual </label>

        <div class="mb-4 text-center">
          <img
            src="{% if equipo.escudo == 'default_team.png' %}
                {{ url_for('static', filename='img/default_team.png') }}
             {% else %}
                {{ url_for('static', filename='uploads/equipos/' + equipo.escudo) }}
             {% endif %}"
            class="team-logo"
            style="width: 120px; height: 120px"
          />

          <p class="text-muted small">
            Selecciona una nueva imagen si deseas reemplazar el escudo.
          </p>
        </div>

        <hr />

        <label class="form-label fw-bold"> Cambiar escudo </label>

        {% else %}

        <label class="form-label fw-bold"> Escudo </label>

        {% endif %}

        <div class="upload-box">
          <input
            type="file"
            id="inputImage"
            name="escudo"
            accept="image/*"
            hidden
          />

          <label for="inputImage" class="upload-area">
            <div>
              <i class="bi bi-cloud-arrow-up fs-1"></i>

              <h5>Arrastra una imagen</h5>

              <p>o haz clic para seleccionar</p>
            </div>
          </label>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-8">
          <img id="previewImage" style="max-width: 100%; display: none" />
        </div>

        <div class="col-lg-4">
          <div
            class="preview border rounded"
            style="width: 250px; height: 250px; overflow: hidden"
          ></div>
        </div>
      </div>
      <div id="toolbar" class="cropper-toolbar">
        <button
          type="button"
          id="zoomIn"
          class="btn btn-outline-success crop-btn"
          title="Acercar"
        >
          <i class="bi bi-zoom-in"></i>
        </button>

        <button
          type="button"
          id="zoomOut"
          class="btn btn-outline-success crop-btn"
          title="Alejar"
        >
          <i class="bi bi-zoom-out"></i>
        </button>

        <button
          type="button"
          id="rotate"
          class="btn btn-outline-primary crop-btn"
          title="Rotar"
        >
          <i class="bi bi-arrow-clockwise"></i>
        </button>

        <button
          type="button"
          id="reset"
          class="btn btn-outline-danger crop-btn"
          title="Reiniciar"
        >
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>

        <button type="button" id="applyCrop" class="btn btn-success">
          <i class="bi bi-check-circle-fill"></i>

          Aplicar
        </button>
      </div>
      <hr />

      {% if equipo %}

      <button type="submit" class="btn btn-success">
        <i class="bi bi-floppy-fill"></i>
        Guardar Cambios
      </button>

      {% else %}

      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle"></i>
        Guardar Equipo
      </button>

      {% endif %}

      <a href="{{ url_for('equipos.index') }}" class="btn btn-secondary">
        <i class="bi bi-x-circle"></i>

        Cancelar
      </a>
    </form>
  </div>
</div>
